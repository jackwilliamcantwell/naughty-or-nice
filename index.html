<style>
/* North Pole HQ: pine header, snow cards; berry = naughty, green = nice. Deliberately single (light) theme. */
:root{
  --pine:#10392C; --pine-2:#1B5442; --snow:#FFFFFF; --frost:#EAF2EF; --frost-2:#DCE8E3; --line:#C9D8D2;

.top{background:var(--pine);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

.rdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
button.rd{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
button.rd b{font-size:17px;color:var(--pine)} button.rd span{font-size:12px;font-family:var(--mono)}
button.rd.vouch span{color:var(--nice)} button.rd.bite span{color:var(--berry)}
button.rd.on{border-color:var(--pine);box-shadow:inset 0 0 0 1.5px var(--pine);background:var(--frost)}
button.rd:disabled{opacity:.55;cursor:default;background:var(--frost)} button.rd em{font-style:normal;font-size:12px;color:var(--muted)}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
button.num{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
button.num b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--pine);line-height:1} button.num span{font-size:11px;color:var(--muted)}
button.num.on{background:var(--pine);border-color:var(--pine)} button.num.on b,button.num.on span{color:#fff}
button.num:disabled{opacity:.3;text-decoration:line-through;cursor:default}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--frost-2);vertical-align:top}
table.t td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);text-align:right}
.scroll{overflow-x:auto}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.cardnum{font-family:var(--display);font-size:22px;color:var(--pine)}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--frost);border-radius:12px;padding:12px;font-size:14px}
.answer{background:var(--frost);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.answer.picked{background:var(--gold-soft);box-shadow:inset 0 0 0 1.5px var(--gold)}
.answer .txt{white-space:pre-wrap}
.cfo main.wrap,.cfo .top .wrap{--w:980px}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:0}}}

<script>
/* ============================================================
   NAUGHTY OR NICE — v1
   CONFIG holds everything you'd edit. STATE is the game data.
   ============================================================ */
const LIVE = !!(window.FIREBASE_CONFIG && window.firebase); // live: shared Firestore. Otherwise demo: this browser only.
const DEMO = !LIVE;
const GAME_ID = 'friendmas-2026';

const CONFIG = {
  year: 2026,
  // Placeholder dates: Friendmas weekend TBC
  times: {
    open:          '2026-12-04T20:00',
    kitchenClose:  '2026-12-05T10:00',
    reindeerBy:    '2026-12-05T11:00',
    chefRankBy:    '2026-12-05T12:00',
    miracleCutoff: '2026-12-05T17:00',
    close:         '2026-12-05T18:00',
    results:       '2026-12-05T20:00',
  },
  points: { start:100, floor:40, rival:10, own:10, kitchen:[15,10,5], reindeer:20, miracle:30, miracleTrigger:60, group:15 },
  // Group tasks: names TBC
  groupTasks: ['Group task 1','Group task 2','Group task 3'],
  limits: { rival:3, own:3, ownPerTarget:2, gossipGapMin:60 },
  groups: [
    { id:'sbig', name:'Snowtorious B.I.G', short:'SBIG', color:'#B4213D' },
    { id:'sbs',  name:'Sleigh Baby Sleigh', short:'SBS', color:'#1B5442' },
    { id:'gg',   name:'Grotto Gremlins',   short:'GG',  color:'#8A5A12' },
  ],
  elves: [
    { id:'gornall', name:'Gornall', group:'sbig', token:'elf-gornall-k7q2' },
    { id:'kim',     name:'Kim',     group:'sbig', token:'elf-kim-p3x9' },
    { id:'hannah',  name:'Hannah',  group:'sbig', token:'elf-hannah-v8m4' },
    { id:'turk',    name:'Turk',    group:'sbs',  token:'elf-turk-r2d6' },
    { id:'ash',     name:'Ash',     group:'sbs',  token:'elf-ash-w5n1' },
    { id:'lauren',  name:'Lauren',  group:'sbs',  token:'elf-lauren-c4j8' },
    { id:'pete',    name:'Pete',    group:'gg',   token:'elf-pete-h6t3' },
    { id:'grace',   name:'Grace',   group:'gg',   token:'elf-grace-z9b5' },
    { id:'johnson', name:'Johnson', group:'gg',   token:'elf-johnson-y1f7' },
  ],
  chefs: [
    { id:'kat', name:'Kat Bell',    short:'Kat', token:'chef-kat-m2s8' },
    { id:'dan', name:'Dan Shilcof', short:'Dan', token:'chef-dan-q4l6' },
  ],
  cfoToken: 'cfo-hq-x8r3w1',
  questions: [
    { id:'q1', chef:'kat', text:'What 3-course dinner party menu would you cook for me?' },
    { id:'q2', chef:'kat', text:'Describe the perfect golf swing to me?' },
    { id:'q3', chef:'dan', text:'What is your favourite thing about Scotland?' },
    { id:'q4', chef:'dan', text:'If you had a pick up truck for a day, what would you do with it?' },
  ],
  reindeer: [
    { name:'Harry', type:'vouch' }, { name:'Toby', type:'vouch' }, { name:'Sophia', type:'vouch' },
    { name:'Alfie', type:'bite' },  { name:'Teddy', type:'bite' }, { name:'Freddy', type:'bite' },
  ],
  missions: [
    { text:'Get a selfie with 3 or more of the Reindeer (the kids).', evidence:'Photo' },
    { text:'Get someone to pour you a drink.', evidence:'Photo' },
    { text:'Get someone to sing a line of a Christmas song.', evidence:'Voice note' },
    { text:'Get someone to tell you their best ever Friendmas memory.', evidence:'Voice note' },
    { text:'Get someone to hand you a Christmas decoration.', evidence:'The decoration itself' },
    { text:'Get someone to say “Merry Christmas” to you in an accent.', evidence:'Voice note' },
    { text:'Get someone to tell you, and at least one other person, what they’re getting their partner for Christmas.', evidence:'Your witness confirms to Mr or Mrs Claus' },
  ],
};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = k => new Date(CONFIG.times[k]).getTime();
const P = CONFIG.points, L = CONFIG.limits;
const elf = id => CONFIG.elves.find(e => e.id === id);
const grp = id => CONFIG.groups.find(g => g.id === id);
const chef = id => CONFIG.chefs.find(c => c.id === id);
const q = id => CONFIG.questions.find(x => x.id === id);
const uid = () => Math.random().toString(36).slice(2, 10);
const DAY = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(t){ const d=new Date(t); let h=d.getHours(), m=d.getMinutes(); const ap=h>=12?'pm':'am'; h=h%12||12; return `${DAY[d.getDay()]} ${h}${m?':'+String(m).padStart(2,'0'):''}${ap}`; }
function dur(ms){ const m=Math.max(1,Math.round(ms/60000)); return m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`; }

/* ---------- state ---------- */
const KEY = 'naughty-or-nice-v1';
const blank = () => ({ groupTasks:{}, reports:[], gossip:[], answers:{}, rankings:{}, taps:[], miracles:{}, cardNumbers:null, demoClock: LIVE ? null : T('open')+15*60000 });
let S = blank(), READY = !LIVE;
if (DEMO){ try { S = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch(e){ S = blank(); } if (!S.cardNumbers) S.cardNumbers = makeCardNumbers(); }
function persist(){ if(DEMO) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
function commit(){ checkMiracles(); if(LIVE) pushDiff(); else persist(); render(); }
if (DEMO) window.addEventListener('storage', e => { if (e.key===KEY){ try{ S=JSON.parse(e.newValue)||S; }catch(_){} render(); } });

/* ---------- shared database (live mode) ----------
   One Firestore document per item, so two phones never overwrite each other. */
const COLS=['reports','gossip','taps','answers','rankings','miracles','groupTasks','settings'];
let remote={}, store=null;
const clean=o=>JSON.parse(JSON.stringify(o));
function toDocs(){
  const ans={}; Object.entries(S.answers).forEach(([e,o])=>Object.entries(o).forEach(([q,a])=>{ ans[e+'__'+q]={elf:e,q,...a}; }));
  return { reports:Object.fromEntries(S.reports.map(r=>[r.id,r])), gossip:Object.fromEntries(S.gossip.map(g=>[g.id,g])), taps:Object.fromEntries(S.taps.map(x=>[x.id,x])),
    answers:ans, rankings:{...S.rankings}, miracles:{...S.miracles}, groupTasks:Object.fromEntries(Object.entries(S.groupTasks||{}).map(([k,v])=>['t'+k,v])),
    settings:{main:{cardNumbers:S.cardNumbers||null,testClock:S.demoClock||null}} };
}
function fromDocs(){
  const copy=clean(remote), d=k=>copy[k]||{}; // copy, so local edits never alter what we compare against
  S.reports=Object.values(d('reports')); S.gossip=Object.values(d('gossip')); S.taps=Object.values(d('taps'));
  S.answers={}; Object.values(d('answers')).forEach(a=>{ (S.answers[a.elf] ||= {})[a.q]={text:a.text,t:a.t}; });
  S.rankings={...d('rankings')}; S.miracles={...d('miracles')};
  S.groupTasks=Object.fromEntries(Object.entries(d('groupTasks')).map(([k,v])=>[k.slice(1),v]));
  const st=d('settings').main||{}; S.cardNumbers=st.cardNumbers||null; S.demoClock=st.testClock||null;
}
function pushDiff(){
  if(!LIVE||!READY) return;
  const docs=toDocs();
  COLS.forEach(c=>{ const mine=docs[c]||{}, theirs=remote[c]||{};
    Object.entries(mine).forEach(([id,v])=>{ const cv=clean(v); if(JSON.stringify(cv)===JSON.stringify(theirs[id])) return;
      if(c==='miracles' && !theirs[id]) store.create(c,id,cv); else store.set(c,id,cv); });
    Object.keys(theirs).forEach(id=>{ if(!(id in mine)) store.del(c,id); }); });
}
function fbStore(cfg){
  firebase.initializeApp(cfg); const fs=firebase.firestore(); const root=fs.collection('games').doc(GAME_ID);
  const fail=e=>{ console.error(e); toast('Couldn’t save. Check your signal and try again.'); };
  return {
    listen(c,cb){ root.collection(c).onSnapshot(qs=>{ const m={}; qs.forEach(d=>m[d.id]=d.data()); cb(m); }, e=>{ console.error(e); toast('Can’t reach the North Pole. Check your signal.'); }); },
    set(c,id,v){ return root.collection(c).doc(id).set(v).catch(fail); },
    del(c,id){ return root.collection(c).doc(id).delete().catch(fail); },
    create(c,id,v){ const ref=root.collection(c).doc(id); return fs.runTransaction(async tx=>{ const d=await tx.get(ref); if(!d.exists) tx.set(ref,v); }).catch(fail); },
  };
}
function startLive(){
  store = window.__testStore || fbStore(window.FIREBASE_CONFIG);
  const loaded=new Set();
  COLS.forEach(c=>store.listen(c,m=>{ remote[c]=m; loaded.add(c);
    if(loaded.size<COLS.length) return;
    fromDocs();
    if(!READY){ READY=true; if(!S.cardNumbers && persona?.role==='cfo'){ S.cardNumbers=makeCardNumbers(); pushDiff(); } }
    if(checkMiracles()) pushDiff();
    render(); }));
}
function now(){ return S.demoClock ? S.demoClock : Date.now(); }
function makeCardNumbers(){
  const pool=[]; for(let n=11;n<=99;n++) if(n%11) pool.push(n);
  const out={}; CONFIG.elves.forEach(e=>{ out[e.id]=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; }); return out;
}

/* ---------- phases ---------- */
const isOpen = () => now()>=T('open') && now()<T('close');
const kitchenOpen = () => now()>=T('open') && now()<T('kitchenClose');
const phaseLabel = () => now()<T('open') ? `Opens ${fmt(T('open'))}` : now()<T('close') ? `Open · closes ${fmt(T('close'))}` : 'Closed · results at 8pm';

/* ---------- scoring engine ---------- */
const rstat=r=>r.status||'approved';
const approvedReports=()=>S.reports.filter(r=>rstat(r)==='approved');
function ledger(){
  const it=[];
  approvedReports().forEach(r=>it.push({t:r.approvedT||r.t,kind:r.type,from:r.from,to:r.to,reason:r.reason,id:r.id}));
  Object.entries(S.rankings).forEach(([qid,rk])=>rk.picks.forEach((e,i)=>{ if(e) it.push({t:rk.t,kind:'kitchen',to:e,amt:P.kitchen[i],qid,place:i+1}); }));
  S.taps.forEach(x=>it.push({t:x.t,kind:x.type,to:x.elf,reindeer:x.reindeer,id:x.id}));
  Object.entries(S.miracles).forEach(([e,m])=>{ if(m.status==='approved') it.push({t:m.approvedT,kind:'miracle',to:e}); });
  Object.entries(S.groupTasks||{}).forEach(([k,g])=>CONFIG.elves.filter(e=>e.group===g.group).forEach(e=>it.push({t:g.t,kind:'group',to:e.id,task:+k})));
  return it.sort((a,b)=>a.t-b.t);
}
function scores(upTo=Infinity){
  const sc={}, last={}, dip={};
  CONFIG.elves.forEach(e=>{ sc[e.id]=P.start; last[e.id]=0; });
  const hist=[{t:T('open'),s:{...sc}}], applied=[];
  const down=(id,n)=>{ const d=Math.min(n,Math.max(0,sc[id]-P.floor)); sc[id]-=d; return d; };
  for(const x of ledger()){
    if(x.t>upTo) break;
    const fx={};
    if(x.kind==='rival'){ fx[x.to]=-down(x.to,P.rival); }
    else if(x.kind==='own'){ const d=down(x.to,P.own); fx[x.to]=-d; sc[x.from]+=d; fx[x.from]=d; }
    else if(x.kind==='kitchen'){ sc[x.to]+=x.amt; fx[x.to]=x.amt; }
    else if(x.kind==='vouch'){ sc[x.to]+=P.reindeer; fx[x.to]=P.reindeer; }
    else if(x.kind==='bite'){ fx[x.to]=-down(x.to,P.reindeer); }
    else if(x.kind==='miracle'){ sc[x.to]+=P.miracle; fx[x.to]=P.miracle; }
    else if(x.kind==='group'){ sc[x.to]+=P.group; fx[x.to]=P.group; }
    Object.keys(fx).forEach(id=>{ if(fx[id]) last[id]=x.t; if(sc[id]<P.miracleTrigger && !dip[id]) dip[id]=x.t; });
    applied.push({...x,fx}); hist.push({t:x.t,s:{...sc}});
  }
  const rank=CONFIG.elves.map(e=>e.id).sort((a,b)=>sc[b]-sc[a] || last[a]-last[b]);
  const groups=CONFIG.groups.map(g=>({...g,total:CONFIG.elves.filter(e=>e.group===g.id).reduce((n,e)=>n+sc[e.id],0),last:Math.max(...CONFIG.elves.filter(e=>e.group===g.id).map(e=>last[e.id]))}))
    .sort((a,b)=>b.total-a.total || a.last-b.last);
  return {sc,last,dip,hist,applied,rank,groups};
}
function checkMiracles(){
  let added=false;
  const {dip}=scores(now());
  const used=Object.values(S.miracles).map(m=>m.mission);
  Object.entries(dip).forEach(([id,t])=>{
    if(S.miracles[id] || t>T('miracleCutoff')) return;
    const free=CONFIG.missions.map((_,i)=>i).filter(i=>!used.includes(i));
    const pick=(free.length?free:CONFIG.missions.map((_,i)=>i))[Math.floor(Math.random()*(free.length||CONFIG.missions.length))];
    used.push(pick);
    S.miracles[id]={mission:pick,t,status:'assigned'}; added=true;
  });
  return added;
}

  if(m && m.status==='approved') add(true,'Xmas Miracle done','',"tab='mission'");
  const r=L.rival-used(me,'rival').length, o=L.own-used(me,'own').length;
  add(r===0, r?'Report a rival elf':'Rival reports used', r?`${r} of ${L.rival} left · −${P.rival} to them`:'', "tab='report';ui={type:'rival'}");
  add(o===0, o?'Report an elf in your own group':'Own group reports used', o?`${o} of ${L.own} left · +${P.own} to you`:'', "tab='report';ui={type:'own'}");

    ${m.status==='assigned' ? (late?`<div class="lock">The workshop has closed.</div>`:`<button class="btn" onclick="claimMiracle()">Mission complete</button><p class="hint" style="margin:0">Tap this, then find Mr or Mrs Claus and show them your evidence.</p>`)

function claimMiracle(){ const m=S.miracles[persona.id]; m.status='claimed'; m.claimedT=now(); commit(); toast('Now find Mr or Mrs Claus'); }

   ============================================================ */
function shuffleSeed(arr,seed){ let s=0; for(const c of seed) s=(s*31+c.charCodeAt(0))>>>0; const a=[...arr]; for(let i=a.length-1;i>0;i--){ s=(s*1103515245+12345)>>>0; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function answersFor(qid){ return shuffleSeed(CONFIG.elves.filter(e=>S.answers[e.id]?.[qid]?.text).map(e=>({elf:e.id,text:S.answers[e.id][qid].text})), qid); }
function chefView(){
  const c=chef(persona.id), qs=CONFIG.questions.filter(x=>x.chef===c.id);
  if(now()<T('kitchenClose')){
    return `<section class="card pine"><div class="eyebrow" style="color:var(--gold)">Santa’s Kitchen</div><h1 class="h">Hello, ${esc(c.short)}</h1>
      <p class="sub" style="color:#CFE3DA">Answers close ${fmt(T('kitchenClose'))}. Then you rank your top 3 for each question, by ${fmt(T('chefRankBy'))}. You won’t see who wrote what.</p></section>
      ${qs.map(x=>`<section class="card"><h2 class="h" style="font-size:19px">${esc(x.text)}</h2><span class="pill p-mute">${answersFor(x.id).length} of ${CONFIG.elves.length} elves have answered</span></section>`).join('')}`;
  }
  return `<section class="card pine"><div class="eyebrow" style="color:var(--gold)">Santa’s Kitchen</div><h1 class="h">Time to judge, ${esc(c.short)}</h1>
    <p class="sub" style="color:#CFE3DA">Pick your 1st, 2nd and 3rd for each question. Add a line on why if you like; Mr & Mrs Claus read it out. Please finish by ${fmt(T('chefRankBy'))}.</p></section>
    ${qs.map(x=>chefQuestion(x)).join('')}`;
}
function chefQuestion(x){
  const done=S.rankings[x.id], ans=answersFor(x.id);
  const draft = ui['d-'+x.id] ||= {picks:[null,null,null],why:['','','']};
  const labels=['1st','2nd','3rd'];
  if(done) return `<section class="card"><h2 class="h" style="font-size:19px">${esc(x.text)}</h2><div class="lock"><span><b>Submitted ${fmt(done.t)}.</b> Your picks are locked in.</span></div>
    <div class="list">${done.picks.map((e,i)=>e?`<div class="answer picked"><span class="pill p-gold">${labels[i]} · +${P.kitchen[i]}</span><span class="txt">${esc(S.answers[e]?.[x.id]?.text)}</span>${done.why[i]?`<span class="hint">Why: ${esc(done.why[i])}</span>`:''}</div>`:'').join('')}</div></section>`;
  if(!ans.length) return `<section class="card"><h2 class="h" style="font-size:19px">${esc(x.text)}</h2><div class="empty">No answers came in for this one.</div></section>`;
  return `<section class="card"><h2 class="h" style="font-size:19px">${esc(x.text)}</h2><p class="hint" style="margin:0">${ans.length} anonymous answers</p>
    <div class="list">${ans.map((a,k)=>{ const p=draft.picks.indexOf(a.elf);
      return `<div class="answer ${p>=0?'picked':''}"><span class="meta" style="font-family:var(--mono);font-size:12px;color:var(--muted)">Answer ${String.fromCharCode(65+k)}</span><span class="txt">${esc(a.text)}</span>
        <div class="row">${labels.map((l,i)=>`<button class="chip" aria-pressed="${draft.picks[i]===a.elf}" onclick="pick('${x.id}',${i},'${a.elf}')">${l}</button>`).join('')}</div>
        ${p>=0?`<input type="text" id="why-${x.id}-${p}" maxlength="120" placeholder="Why? (optional)" value="${esc(draft.why[p])}" oninput="ui['d-${x.id}'].why[${p}]=this.value">`:''}</div>`; }).join('')}</div>
    <button class="btn gold" onclick="submitRanking('${x.id}')">Lock in my top 3</button></section>`;
}
function pick(qid,i,e){ const d=ui['d-'+qid]; const was=d.picks.indexOf(e); if(was>=0){ d.picks[was]=null; d.why[was]=''; } d.picks[i]= was===i?null:e; render(); }
function submitRanking(qid){
  const d=ui['d-'+qid], need=Math.min(3,answersFor(qid).length);
  if(d.picks.filter(Boolean).length<need) return toast(`Pick your top ${need} first`);
  S.rankings[qid]={picks:[...d.picks],why:[...d.why],t:now()}; commit(); toast('Locked in');
}

function logTap(){
  const r=CONFIG.reindeer.find(x=>x.name===ui.rd), e=elf(ui.pick);
  if(!r||!e) return;
  if(S.taps.some(x=>x.reindeer===r.name)) return toast(`${r.name} has already had their go`);
  if(S.taps.some(x=>x.elf===e.id)) return toast(`${e.name} has already been picked`);
  S.taps.push({id:uid(),reindeer:r.name,type:r.type,elf:e.id,t:now()}); ui={}; commit(); toast(`${r.name} ${r.type==='vouch'?'vouched for':'bit'} ${e.name}`);
}
function undoTap(id){ S.taps=S.taps.filter(x=>x.id!==id); commit(); toast('Tap removed'); }

  const a=[];

  S.gossip.forEach(g=>a.push({t:g.t,html:`<b>${esc(elf(g.from).name)}</b> posted gossip <q>${esc(g.text)}</q> <span class="pill p-mute">${g.status}</span>`}));
  Object.entries(S.answers).forEach(([e,o])=>Object.entries(o).forEach(([qid,x])=>a.push({t:x.t,html:`<b>${esc(elf(e).name)}</b> answered “${esc(q(qid).text)}”`})));

  S.taps.forEach(x=>a.push({t:x.t,html:`<b>${esc(x.reindeer)}</b> ${x.type==='vouch'?'vouched for':'bit'} <b>${esc(elf(x.elf).name)}</b>`}));

  return a.sort((x,y)=>y.t-x.t);
}

async function offerFile(name, blob){
  try { const d = window.claude?.use ? await window.claude.use('downloads') : null;
    if(d){ await d.save({filename:name,data:blob}); toast('Downloaded'); return; } } catch(e){ if(e?.code==='declined') return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function copyText(t){ try{ navigator.clipboard.writeText(t).then(()=>toast('Link copied'),()=>toast(t)); }catch(e){ toast(t); } }

function simulate(){
  let seed=Date.now()%100000; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280; const pickR=a=>a[Math.floor(rnd()*a.length)];
  const between=(a,b)=>Math.round(a+rnd()*(b-a));
  const awake=(a,b)=>{ for(let k=0;k<50;k++){ const t=between(a,b), h=new Date(t).getHours(); if(h>=8||h<1) return t; } return between(a,b); };
  const reasons=['Didn’t pass me the salt','Breathing too loudly during the film','Took the last pig in blanket','Laughed at their own joke. Twice.','Hogged the good end of the sofa','Wore a better jumper than me','Said “honestly” fourteen times','Suspiciously nice all morning','Ate my crisps','Skipped their round','Played Mariah before 10am','Took the purple one from the Quality Street','Asked who the chefs are','Fell asleep at 9:40pm','Claimed the shower for 25 minutes','Whispered to a Reindeer','Knows too much','Made the tea too weak'];
  const gossip=['Heard Kim is planning to report her own team','Someone’s been very generous with the prosecco. Suspicious.','Grotto Gremlins have a pact. Trust no one.','Turk was seen whispering to a Reindeer','SBS are going after Pete tonight','A certain elf answered the golf question with a diagram','Lauren hasn’t filed a single report. Yet.','Johnson asked who the chefs are. Twice.','Hannah is far too relaxed for someone being reported'];
  const bank={
    q1:['Scallops, beef wellington, sticky toffee pudding','Prawn cocktail, Sunday roast, Viennetta. Retro night.','Burrata, lamb rump, tiramisu','Soup, more soup, cheese board','Gyoza, katsu curry, mochi','Smoked salmon blinis, duck breast, chocolate fondant','Nachos. Nachos. Nachos.','Caesar salad, steak frites, crème brûlée','Pâté, coq au vin, lemon tart'],
    q2:['Grip it and rip it','Slow back, pause at the top, then commit','Head still, hips lead, finish tall','Pretend no one is watching. Everyone is watching.','Think pendulum, not lumberjack','Smooth tempo and let the club do the work','Tee it high and let it fly','Shoulders turn, weight shifts, eyes on the ball','Close eyes, pray, swing'],
    q3:['Every single glen','Irn-Bru as a food group','Whisky by a fire','Edinburgh at Christmas','Haggis, neeps and tatties','The people, and the accents','Golf where it was invented','The midges. Kidding. The lochs.','Hogmanay'],
    q4:['Move house in one trip','Tip run. Finally.','Drive to the coast with a sofa in the back','Tailgate BBQ at the football','Help every mate move flat in one day','Buy a Christmas tree that’s far too big','Pretend I live in Texas','Take the kids to the farm','Garden centre trolley dash'],
  };
  const why=['Made me laugh out loud','Most creative','I’d genuinely eat this','Bold choice','Short and sweet','Respect','I want to be there'];
  S=blank(); S.cardNumbers=makeCardNumbers();
  const o=T('open'), c=T('close');
  // answers: Fri night / Sat morning
  const off={}; CONFIG.questions.forEach(x=>off[x.id]=Math.floor(rnd()*9));
  CONFIG.elves.forEach((e,i)=>{ S.answers[e.id]={}; CONFIG.questions.forEach(x=>{ if(rnd()<.92) S.answers[e.id][x.id]={text:bank[x.id][(i+off[x.id])%9],t:awake(o+10*60000,T('kitchenClose')-20*60000)}; }); });
  // reports spread across window
  CONFIG.elves.forEach(e=>{
    const rivals=CONFIG.elves.filter(x=>x.group!==e.group), mates=CONFIG.elves.filter(x=>x.group===e.group&&x.id!==e.id);
    const nr=between(1,3), no=between(0,3); const ownCount={};
    for(let k=0;k<nr;k++) S.reports.push({id:uid(),type:'rival',from:e.id,to:pickR(rivals).id,reason:pickR(reasons),t:awake(o+20*60000,c-30*60000)}); S.reports.forEach(r=>{ if(!r.status){ r.status=rnd()<.85?'approved':'rejected'; r.vettedT=r.t+between(5,45)*60000; if(r.status==='approved') r.approvedT=r.vettedT; } });
    for(let k=0;k<no;k++){ const t=pickR(mates); if((ownCount[t.id]||0)>=2) continue; ownCount[t.id]=(ownCount[t.id]||0)+1; S.reports.push({id:uid(),type:'own',from:e.id,to:t.id,reason:pickR(reasons),t:awake(o+40*60000,c-20*60000)}); }
  });
  // gossip
  gossip.forEach((g,i)=>{ const t=awake(o+30*60000,c-60*60000); S.gossip.push({id:uid(),from:pickR(CONFIG.elves).id,text:g,t,status:i===2||i===6?'rejected':'approved',approvedT:t+between(5,40)*60000}); });
  // group tasks
  CONFIG.groupTasks.forEach((_,k)=>{ S.groupTasks[k]={group:pickR(CONFIG.groups).id,t:awake(o+60*60000,c-30*60000)}; });
  // reindeer
  const rdPool=[...CONFIG.elves].sort(()=>rnd()-.5);
  CONFIG.reindeer.forEach((r,i)=>S.taps.push({id:uid(),reindeer:r.name,type:r.type,elf:rdPool[i].id,t:between(T('kitchenClose')+5*60000,T('reindeerBy')-5*60000)}));
  // rankings
  CONFIG.questions.forEach(x=>{ const ans=answersFor(x.id).map(a=>a.elf); const p=[]; while(p.length<3&&p.length<ans.length){ const e=pickR(ans); if(!p.includes(e)) p.push(e);} S.rankings[x.id]={picks:p,why:p.map(()=>pickR(why)),t:between(T('kitchenClose')+40*60000,T('chefRankBy')-10*60000)}; });
  // miracles
  S.demoClock=c+30*60000; checkMiracles();
  Object.values(S.miracles).forEach(m=>{ if(rnd()<.75){ m.status='approved'; m.claimedT=Math.min(m.t+between(30,120)*60000,c-10*60000); m.approvedT=m.claimedT+5*60000; } });
  checkMiracles(); if(LIVE) pushDiff(); else persist(); tab='live'; persona={role:'cfo'}; render(); toast('Simulated a full weekend');
}

async function exportDeck(){
  if(typeof PptxGenJS==='undefined') return toast('Deck builder didn’t load. Check your connection.');

  try { const blob = await buildDeck(); await offerFile(`Naughty-or-Nice-Results-${CONFIG.year}.pptx`, blob); }
  catch(e){ console.error(e); toast('Couldn’t build the deck'); }
  if(btn){ btn.disabled=false; btn.textContent='Download results deck (.pptx)'; }
}

function svgPng(svg, px=600){
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement('canvas'); c.width=px; c.height=px; c.getContext('2d').drawImage(img,0,0,px,px); res(c.toDataURL('image/png')); };
    img.onerror=rej; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg); });
}

/* ---------- storylines from the data ---------- */
function leaderAt(hist,i){ const s=hist[i].s; return CONFIG.elves.map(e=>e.id).sort((a,b)=>s[b]-s[a])[0]; }
function insights(R){
  const out=[];
  const own=S.reports.filter(r=>r.type==='own'), rival=S.reports.filter(r=>r.type==='rival');
  const stabbers=new Set(own.map(r=>r.from)).size, n=CONFIG.elves.length;
  out.push({big: stabbers===n?'ALL':`${stabbers} of ${n}`, text: stabbers===n?`of you stabbed your own group in the back to get ahead.`:`elves stabbed their own group in the back to get ahead.`, tone:'bad'});
  // reign
  const reign={}; let changes=0, prev=null;
  for(let i=0;i<R.hist.length;i++){ const h=R.hist[i], nxt=R.hist[i+1]; const t1=Math.min(nxt?nxt.t:T('close'),T('close')); const L=leaderAt(R.hist,i);
    if(prev && L!==prev && h.t>T('open')) changes++; prev=L; reign[L]=(reign[L]||0)+Math.max(0,t1-h.t); }
  const longest=Object.entries(reign).sort((a,b)=>b[1]-a[1])[0];
  if(longest && longest[0]!==R.rank[0]) out.push({big:`${Math.round(longest[1]/36e5)} hrs`, text:`${elf(longest[0]).name} sat on top of the pile for longest… and still lost the crown.`, tone:'gold'});
  out.push({big:String(changes), text:`times the top spot changed hands.`, tone:'gold'});
  // biggest fall
  let fall={id:null,d:0};
  CONFIG.elves.forEach(e=>{ let peak=-1; R.hist.forEach(h=>{ peak=Math.max(peak,h.s[e.id]); const d=peak-h.s[e.id]; if(d>fall.d) fall={id:e.id,d}; }); });
  if(fall.id) out.push({big:`−${fall.d}`, text:`${elf(fall.id).name}’s biggest fall from their peak. Ouch.`, tone:'bad'});
  // most wanted
  const recv=CONFIG.elves.map(e=>({e,n:S.reports.filter(r=>r.to===e.id).length})).sort((a,b)=>b.n-a.n);
  if(recv[0]?.n) out.push({big:String(recv[0].n), text:`Naughty reports landed on ${recv[0].e.name}. More than anyone.`, tone:'bad'});
  // most stabbed by own
  const ownRecv=CONFIG.elves.map(e=>({e,n:own.filter(r=>r.to===e.id).length})).sort((a,b)=>b.n-a.n);
  if(ownRecv[0]?.n>1) out.push({big:String(ownRecv[0].n), text:`times ${ownRecv[0].e.name} was knifed by their own group.`, tone:'bad'});
  const m=Object.values(S.miracles); out.push({big:`${m.length}`, text:`elves needed an Xmas Miracle. ${m.filter(x=>x.status==='approved').length} pulled it off.`, tone:'nice'});
  const gb=S.gossip.filter(g=>g.status==='rejected').length; out.push({big:String(S.gossip.filter(g=>g.status==='approved').length), text:`bits of gossip made the feed. ${gb} ${gb===1?'was':'were'} too much even for Mr & Mrs Claus.`, tone:'gold'});
  out.push({big:String(rival.length+own.length), text:`Naughty reports filed in ${Math.round((T('close')-T('open'))/36e5)} hours.`, tone:'bad'});
  return out.slice(0,6);
}
const KIND={rival:'rival reports',own:'own group reports',kitchen:'Santa’s Kitchen',vouch:'Reindeer vouches',bite:'Reindeer bites',miracle:'Xmas Miracles',group:'group tasks'};
const THEMES=[
  ['Greedy',/\b(ate|eat|took|take|last|stole|steal|hog|crisps?|pie|quality street|purple|food|snack|seconds|biscuit|chocolate)/i],
  ['Loud',/(loud|breath|snor|shout|sing|noise|yell|laugh)/i],
  ['Lazy',/(asleep|sleep|lazy|nap|bed|skipped|never helped|sofa)/i],
  ['Tight',/(round|tight|stingy|pay|paid)/i],
  ['Sneaky',/(whisper|knows too much|plot|sneak|suspicious|spy|chefs?|reindeer|secret)/i],
  ['Smug',/(better|smug|show.?off|nice|perfect|jumper|outfit)/i],
  ['Rude',/(rude|pass|ignor|interrupt|weak|tea|shower|queue)/i],
  ['Annoying',/(honestly|joke|mariah|annoy|talk|said|kept|always|again)/i],
];
const themeOf=r=>(THEMES.find(([,re])=>re.test(r))||['Just petty'])[0];
function themeSummary(list){ const c={}; list.forEach(r=>{ const t=themeOf(r.reason); c[t]=(c[t]||0)+1; }); return Object.entries(c).sort((a,b)=>b[1]-a[1]); }
function segmentStory(R,a,b){
  const d={}, why={}; CONFIG.elves.forEach(e=>{ d[e.id]=0; why[e.id]={}; });
  R.applied.filter(x=>x.t>a&&x.t<=b).forEach(x=>Object.entries(x.fx).forEach(([id,v])=>{ if(!v) return; d[id]+=v; const k=x.kind==='own'&&id===x.from?'stealing from their own group':KIND[x.kind]; why[id][k]=(why[id][k]||0)+v; }));
  const desc=id=>Object.entries(why[id]).sort((p,q)=>Math.abs(q[1])-Math.abs(p[1])).slice(0,2).map(([k,v])=>`${v>0?'+':'−'}${Math.abs(v)} ${k}`).join(', ');
  const ids=CONFIG.elves.map(e=>e.id);
  const up=[...ids].sort((p,q)=>d[q]-d[p])[0], down=[...ids].sort((p,q)=>d[p]-d[q])[0];
  const lines=[];
  if(d[up]>0) lines.push({t:`${elf(up).name} climbed ${d[up]}`,s:desc(up),tone:'nice'});
  if(d[down]<0) lines.push({t:`${elf(down).name} fell ${-d[down]}`,s:desc(down),tone:'bad'});
  return lines;
}

async function buildDeckInner(){
  const C={pine:'10392C',pine2:'1B5442',snow:'FFFFFF',frost:'EAF2EF',ink:'12241E',muted:'56685F',berry:'B4213D',berrySoft:'F8E3E7',nice:'1F7A4D',niceSoft:'DFF1E6',gold:'D8A23A',goldSoft:'FBF0D9',mint:'CFE3DA'};
  const HF='Arial Black', BF='Arial';
  const ART={}; for(const [k,v] of Object.entries(ART_SVG)) ART[k]=await svgPng(v);
  const R=scores(Infinity);
  const pptx=new PptxGenJS(); pptx.layout='LAYOUT_WIDE'; pptx.title='Naughty or Nice: The Results';
  const gcol=id=>grp(id).color.replace('#','');
  const art=(s,k,x,y,w)=>s.addImage({data:ART[k],x,y,w,h:w});
  const head=(s,eyebrow,title,o={})=>{ s.background={color:o.dark?C.pine:C.snow};
    if(eyebrow) s.addText(eyebrow.toUpperCase(),{x:.6,y:.35,w:10,h:.35,fontFace:BF,fontSize:12,bold:true,color:o.dark?C.gold:C.berry,charSpacing:4});
    s.addText(title,{x:.6,y:.65,w:o.w||12.1,h:.9,fontFace:HF,fontSize:o.size||32,color:o.dark?C.snow:C.pine,valign:'top',fit:'shrink'}); };
  const divider=(eyebrow,title,sub,artKey,notes)=>{ const s=pptx.addSlide(); s.background={color:C.pine};
    s.addText(eyebrow.toUpperCase(),{x:.8,y:2.3,w:8,h:.4,fontFace:BF,fontSize:14,bold:true,color:C.gold,charSpacing:5});
    s.addText(title,{x:.8,y:2.75,w:8.2,h:1.5,fontFace:HF,fontSize:50,color:C.snow,valign:'top',fit:'shrink'});
    if(sub) s.addText(sub,{x:.8,y:4.3,w:8,h:.9,fontFace:BF,fontSize:20,color:C.mint,valign:'top'});
    if(artKey) art(s,artKey,9.2,1.6,3.6);
    if(notes) s.addNotes(notes); return s; };
  const card=(s,x,y,w,h,fill,line)=>s.addShape(pptx.ShapeType.roundRect,{x,y,w,h,fill:{color:fill},line:{color:line||fill,width:1.5},rectRadius:.12});
  const cell=(text,o={})=>({text:String(text),options:{fontFace:BF,fontSize:14,color:C.ink,valign:'middle',margin:[4,8,4,8],...o}});
  const hcell=t=>cell(t,{bold:true,fontSize:11,color:C.muted,fill:{color:C.frost}});
  const tone=t=>t==='bad'?[C.berrySoft,C.berry]:t==='nice'?[C.niceSoft,C.nice]:[C.goldSoft,'8A5A12'];
  let s;

  /* 1. Title */
  s=pptx.addSlide(); s.background={color:C.pine};
  s.addText('FRIENDMAS '+CONFIG.year,{x:.8,y:1.6,w:8,h:.4,fontFace:BF,fontSize:16,bold:true,color:C.gold,charSpacing:6});
  s.addText('Naughty or Nice',{x:.8,y:2.05,w:8.6,h:1.5,fontFace:HF,fontSize:64,color:C.snow,fit:'shrink'});
  s.addText('The Results',{x:.8,y:3.55,w:8,h:.9,fontFace:HF,fontSize:36,color:C.gold});
  s.addText('Presented by Mr & Mrs Claus',{x:.8,y:4.6,w:8.5,h:.5,fontFace:BF,fontSize:18,color:C.mint});
  art(s,'hat',9.3,1.5,3.6);
  s.addNotes('Welcome everyone. Santa is tired, and tonight we find out which group takes over Christmas, and who becomes Head Elf. Nobody has seen a single score yet.');

  /* 2. What really happened */
  s=pptx.addSlide(); head(s,'Before we begin','What really happened this weekend');
  insights(R).forEach((it,i)=>{ const x=.6+(i%3)*4.1, y=1.8+Math.floor(i/3)*2.65; const [bg,fg]=tone(it.tone);
    card(s,x,y,3.85,2.4,bg);
    s.addText(it.big,{x:x+.3,y:y+.2,w:3.3,h:1,fontFace:HF,fontSize:44,color:fg,fit:'shrink'});
    s.addText(it.text,{x:x+.3,y:y+1.2,w:3.3,h:1,fontFace:BF,fontSize:15,color:C.ink,valign:'top'}); });

  divider('And finally','The Winning Group','Which elves take over Christmas from Santa?','trophy','The Head Elf is crowned. Now the group prize.');
  const gs=R.groups; // [1st,2nd,3rd]
  const groupSlide=upto=>{ const final=upto===gs.length; s=pptx.addSlide(); head(s,'The groups',final?'The Winning Group':upto===1?'In third place…':'In second place…',{dark:final});
    for(let i=0;i<gs.length;i++){ const place=gs.length-i, g=gs[place-1], x=.6+i*4.15;
      if(i<upto){ card(s,x,1.9,3.9,4.9,g.color.replace('#',''));
        s.addText(['1st','2nd','3rd'][place-1],{x:x+.3,y:2.1,w:3.3,h:.8,fontFace:HF,fontSize:30,color:C.snow});
        s.addText(g.name,{x:x+.3,y:2.9,w:3.3,h:1.1,fontFace:HF,fontSize:24,color:C.snow,valign:'top',fit:'shrink'});
        const mem=CONFIG.elves.filter(e=>e.group===g.id), sn=since(mem.map(e=>e.id)), gNoon=mem.reduce((n,e)=>n+noonSc[e.id],0);
        s.addText(mem.map(e=>e.name).join('\n'),{x:x+.3,y:3.85,w:3.3,h:1.15,fontFace:BF,fontSize:15,bold:true,color:C.snow,valign:'top'});
        s.addText([{text:`At 12pm: ${gNoon}. Since then: ${sgn(sn.d)}`,options:{bold:true,breakLine:true}},{text:sn.parts.join(' · ')||'No change',options:{}}],{x:x+.3,y:5.0,w:3.3,h:.85,fontFace:BF,fontSize:11,color:C.snow,valign:'top',fit:'shrink'});
        s.addText(`${g.total} pts`,{x:x+.3,y:5.85,w:3.3,h:.8,fontFace:HF,fontSize:28,color:C.goldSoft});
        if(place===1) art(s,'crown',x+2.45,1.15,1.55); }
      else { s.addShape(pptx.ShapeType.roundRect,{x,y:1.9,w:3.9,h:4.9,fill:{color:C.frost},line:{color:'C9D8D2',width:1.5,dashType:'dash'},rectRadius:.12});
        s.addText('?',{x,y:1.9,w:3.9,h:4.9,fontFace:HF,fontSize:90,color:'B5C7C0',align:'center',valign:'middle'}); } }
    return s; };
  const gNote=g=>{ const sn=since(CONFIG.elves.filter(e=>e.group===g.id).map(e=>e.id)); return `${g.name}: ${g.total}. Since midday ${sgn(sn.d)} (${sn.parts.join(', ')||'no change'}).`; };
  groupSlide(1).addNotes('Third place. '+gNote(gs[2]));
  groupSlide(2).addNotes('Second place. '+gNote(gs[1]));
  groupSlide(3).addNotes('The Winning Group, taking over Christmas from Santa. '+gNote(gs[0]));

  s=pptx.addSlide(); s.background={color:C.pine};
  s.addText('Merry Friendmas',{x:.8,y:2.6,w:8.4,h:1.4,fontFace:HF,fontSize:56,color:C.snow});
  s.addText('He sees you when you’re sleeping. So did the app.',{x:.8,y:4.0,w:8.4,h:.6,fontFace:BF,fontSize:20,color:C.gold});
  art(s,'hat',9.3,1.6,3.6);
  return await pptx.write({outputType:'blob'});
}

if(LIVE) startLive(); else { checkMiracles(); persist(); }
render();
setInterval(()=>{ if(LIVE && READY){ if(checkMiracles()) pushDiff(); if(!document.querySelector('textarea:focus,input:focus')) render(); } },60000);
</script>
